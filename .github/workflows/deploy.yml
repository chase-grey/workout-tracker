name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # configure-pages with enablement flips the repo's Pages source to
      # "GitHub Actions" automatically, so no manual Settings toggle is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The lockfile is generated on Windows; npm mis-resolves platform-specific
      # native deps (rollup/tailwind-oxide) from it on Linux. Resolve fresh here.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          # Optional: set this repo secret to bake the backend URL into the build.
          # Users can also enter it at runtime in Settings instead.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
